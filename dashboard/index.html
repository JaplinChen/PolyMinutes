<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts load from here rather than an @import at the top of App.css: an @import inside a
         stylesheet cannot start downloading until that stylesheet has itself been fetched and
         parsed, so the text stayed invisible for one extra round-trip. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=JetBrains+Mono:wght@400..700&display=swap"
    />
    <title>PolyMinutes</title>
    <!-- Mirrors useTheme's initial state so the first paint already has the saved theme. -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme = 'anthropic';
        var palette = 'green';
        try {
          var t = localStorage.getItem('polyminutes_theme') ?? localStorage.getItem('openwalab_theme');
          var p = localStorage.getItem('polyminutes_palette') ?? localStorage.getItem('openwalab_palette');
          if (['light', 'dark', 'system', 'anthropic', 'anthropic-dark'].indexOf(t) >= 0) theme = t;
          if (['green', 'blue', 'graphite', 'indigo', 'amber', 'rose', 'teal'].indexOf(p) >= 0) palette = p;
        } catch (e) {}
        if (theme !== 'system') root.setAttribute('data-theme', theme);
        root.setAttribute('data-palette', palette);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
